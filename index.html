<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom x64 WebAssembly Virtual Machine</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0b0f;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #screen-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 11, 15, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.4s ease;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { margin: 0 0 8px 0; font-size: 20px; font-weight: 600; letter-spacing: -0.5px; }
        p { margin: 0; color: #9ca3af; font-size: 14px; }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <h2>Initializing Custom x64 Engine</h2>
        <p id="loading-status">Loading WebAssembly binary and disk assets...</p>
    </div>

    <div id="screen-container">
        <canvas id="x64-screen" width="1024" height="768"></canvas>
    </div>

    <!-- Load Emscripten compiled JS glue script -->
    <script src="build/emu.js"></script>
    <script>
        const statusText = document.getElementById("loading-status");
        const loadingOverlay = document.getElementById("loading-overlay");
        const canvas = document.getElementById("x64-screen");
        const ctx = canvas.getContext("2d");

        // Fill canvas with black startup backdrop
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Parse query parameters passed from PenguinMod extension (?disk=URL)
        const urlParams = new URLSearchParams(window.location.search);
        const diskUrl = urlParams.get('disk');

        // Emscripten Module hook configuration
        var Module = {
            onRuntimeInitialized: async function() {
                console.log("[Custom x64] Wasm runtime initialized successfully.");
                statusText.textContent = "Allocating virtual RAM (512MB)...";

                // 1. Initialize 512 MB RAM inside our C core
                const RAM_SIZE = 512 * 1024 * 1024;
                _init_x64_emulator(RAM_SIZE);

                // 2. Load custom disk image if provided via GitHub / URL parameters
                if (diskUrl) {
                    try {
                        statusText.textContent = `Fetching disk asset from GitHub...`;
                        console.log(`[Custom x64] Downloading disk: ${diskUrl}`);
                        
                        let response = await fetch(diskUrl);
                        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                        
                        let arrayBuffer = await response.arrayBuffer();
                        let uint8View = new Uint8Array(arrayBuffer);

                        statusText.textContent = "Copying disk image into Wasm memory...";
                        
                        // Retrieve the raw memory pointer from C
                        let memoryPtr = _get_memory_pointer();
                        
                        // Write disk image bytes directly into virtual machine RAM at 0x7C00 (standard boot sector offset)
                        // Or write to base address depending on your memory map setup
                        if (memoryPtr && Module.HEAPU8) {
                            Module.HEAPU8.set(uint8View, memoryPtr + 0x7C00);
                            console.log(`[Custom x64] Successfully loaded ${uint8View.length} bytes into VM memory.`);
                        }
                    } catch (err) {
                        console.error("[Custom x64] Failed to load disk image:", err);
                        statusText.textContent = "Warning: Failed to load disk. Running fallback state.";
                        await new Promise(r => setTimeout(r, 1500));
                    }
                }

                // Hide loading overlay once ready
                loadingOverlay.style.opacity = "0";
                setTimeout(() => loadingOverlay.style.display = "none", 400);

                // 3. Start the Main Emulation State Machine Loop
                startEmulationLoop();
            }
        };

        function startEmulationLoop() {
            function loop() {
                // Execute a batch of CPU instruction cycles per frame for smooth performance
                for (let i = 0; i < 20000; i++) {
                    let running = _x64_step();
                    if (!running) {
                        console.log("[Custom x64] CPU halted.");
                        return;
                    }
                }

                // Render placeholder frame or text confirmation to canvas
                renderEmulatorScreen();

                // Keep loop running via requestAnimationFrame
                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }

        function renderEmulatorScreen() {
            // Renders operational status or graphical buffer onto canvas
            ctx.fillStyle = "#0b0b0f";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#22c55e";
            ctx.font = "bold 24px monospace";
            ctx.fillText("CUSTOM x64 WEBASSEMBLY VIRTUAL MACHINE", 60, 80);
            
            ctx.fillStyle = "#9ca3af";
            ctx.font = "16px monospace";
            ctx.fillText("Status: Running State Machine (Ring 0)", 60, 120);
            ctx.fillText(`Disk Source: ${diskUrl ? diskUrl : "None (Fallback Boot)"}`, 60, 150);
            ctx.fillText("Architecture: 64-bit Long Mode Simulated Core", 60, 180);
        }
    </script>
</body>
</html>
