<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Custom x64 WebAssembly Engine</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; overflow: hidden; display: flex;
            justify-content: center; align-items: center;
        }
        canvas { width: 100%; height: 100%; image-rendering: pixelated; }
    </style>
</head>
<body>

    <!-- Canvas where your custom x64 emulator renders video memory -->
    <canvas id="x64-screen"></canvas>

    <!-- Load your compiled custom Wasm glue script -->
    <script src="build/emu.js"></script>
    <script>
        // Read custom x64 image or ISO URL passed from PenguinMod extension
        const urlParams = new URLSearchParams(window.location.search);
        const diskUrl = urlParams.get('disk') || "";

        // Initialize your custom WebAssembly module compiled from scratch
        Module.onRuntimeInitialized = function() {
            console.log("[Custom x64 Wasm] Engine loaded successfully from GitHub!");
            
            // Allocate memory and initialize your custom CPU registers
            const canvas = document.getElementById('x64-screen');
            const ctx = canvas.getContext('2d');
            
            // Example hook into your compiled C/Wasm start function
            if (Module._init_x64_emulator) {
                Module._init_x64_emulator(512 * 1024 * 1024); // Pass 512MB RAM allocation
            }
        };
    </script>
</body>
</html>
